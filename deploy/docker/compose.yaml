---
services:
  webridge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: webridge
    restart: unless-stopped
    ports:
    - "8080:8080"
    environment:
    - CONFIG_PATH=/app/config.yaml
    - LDAP_SETTINGS_FILE=/app/data/ldap-settings.json
    volumes:
    - ./config.yaml:/app/config.yaml:ro
    - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
