server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 0
  idle_timeout: 120s
  max_header_bytes: 1048576

wetransfer:
  user_agent: "Mozilla/5.0 (compatible; ProxyDownloader/1.0)"
  request_timeout: 30s
  max_redirects: 10

limits:
  max_concurrent_downloads: 50
  max_file_size_gb: 2
  rate_limit_per_minute: 30

logging:
  level: "info"
  format: "json"

ui:
  enabled: true
  title: "File Download Portal"
  max_url_length: 2048

auth:
  session_ttl: 24h
  users:
    - username: "admin"
      password: "admin123"   # CHANGE THIS
      role: "admin"
    - username: "user"
      password: "user123"    # CHANGE THIS
      role: "user"