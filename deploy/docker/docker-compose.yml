services:
  proxy-downloader:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/config.yaml
      - LDAP_SETTINGS_FILE=/app/data/ldap-settings.json
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"